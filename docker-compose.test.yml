# Optional local PostgreSQL 16 for the test suite.
#
#   docker compose -f docker-compose.test.yml up -d
#   export TEST_DATABASE_URL='postgresql+psycopg://clawhunt:clawhunt@127.0.0.1:55474/clawhunt_2874_test'
#
# The test fixture drops and recreates the public schema.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: clawhunt
      POSTGRES_PASSWORD: clawhunt
      POSTGRES_DB: clawhunt_2874_test
    ports:
      - "55474:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawhunt -d clawhunt_2874_test"]
      interval: 3s
      timeout: 3s
      retries: 20